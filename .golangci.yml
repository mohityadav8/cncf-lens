run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - errorlint

linters-settings:
  errcheck:
    # Failing to cache or to close a drained response body is never worth
    # failing a command over, so these are explicitly ignored at call sites.
    check-type-assertions: true
  misspell:
    locale: UK

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
